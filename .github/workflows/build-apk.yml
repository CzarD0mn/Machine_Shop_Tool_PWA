name: Build Android APK

on:
  push:
    branches: [main, master, test]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Android App using Capacitor
        run: |
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "The Machinist Helper" "com.machinisthelper.app" --web-dir "dist"
          npx cap add android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

          # Fix duplicate Kotlin stdlib classes (kotlin-stdlib-jdk7 / jdk8 merged into kotlin-stdlib in Kotlin 1.8+)
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }

          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
                      because("kotlin-stdlib-jdk7 classes are already in kotlin-stdlib")
                  }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
                      because("kotlin-stdlib-jdk8 classes are already in kotlin-stdlib")
                  }
              }
          }
          EOF

          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: machinist-helper-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
